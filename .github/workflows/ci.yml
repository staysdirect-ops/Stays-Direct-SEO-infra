name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Edge functions use the current core
        run: pnpm check:core-sync
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config deno.json */index.ts
        working-directory: supabase/functions
      - run: deno lint --config deno.json
        working-directory: supabase/functions

  database:
    name: Migrations and RLS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres with PostGIS and pg_cron
        run: bash scripts/db-test/start-postgres.sh >> "$GITHUB_ENV"
        env:
          PGDATA_DIR: ${{ runner.temp }}/sd-pg
      - name: Apply migrations and run assertions
        run: bash scripts/db-test/run.sh
        env:
          PGUSER: postgres

  admin:
    name: Admin app build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm admin:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End to end (local Supabase + admin browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRON_SECRET: local-cron-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: |
          supabase start -x studio,postgres-meta,logflare,vector,imgproxy,supavisor,edge-runtime
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | tr -d '"' > "$RUNNER_TEMP/sb.env"
          while IFS='=' read -r k v; do
            [ "$k" = API_URL ] || echo "::add-mask::$v"
            case "$k" in
              API_URL) echo "NEXT_PUBLIC_SUPABASE_URL=$v" >> "$GITHUB_ENV" ;;
              ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$v" >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$v" >> "$GITHUB_ENV" ;;
            esac
          done < "$RUNNER_TEMP/sb.env"
      - name: Start mock external APIs and serve edge functions
        run: |
          nohup node scripts/dev/mock-apis.mjs > "$RUNNER_TEMP/mock.log" 2>&1 &
          PROJECT_ID=$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)
          GW=$(docker network inspect "supabase_network_${PROJECT_ID}" -f '{{(index .IPAM.Config 0).Gateway}}')
          cat > "$RUNNER_TEMP/functions.env" <<ENV
          CRON_SECRET=$CRON_SECRET
          DEV_EXTERNAL_API_PROXY=http://$GW:8787
          ANTHROPIC_API_KEY=mock
          OPENAI_API_KEY=mock
          PERPLEXITY_API_KEY=mock
          COMPANIES_HOUSE_API_KEY=mock
          ENV
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:54321/functions/v1/public-content?type=index && exit 0
            sleep 3
          done
          cat "$RUNNER_TEMP/functions.log"; exit 1
      - name: Radar, SEO engine, AI visibility and public endpoints
        run: bash scripts/dev/e2e-local.sh
      - name: Build admin app against the local stack
        run: pnpm admin:build
      - name: Install Chromium
        run: pnpm --filter @staysdirect/admin exec playwright install --with-deps chromium
      - name: Admin browser tests
        run: pnpm --filter @staysdirect/admin exec playwright test
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/functions.log" || true
          tail -n 50 "$RUNNER_TEMP/mock.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
          retention-days: 7
