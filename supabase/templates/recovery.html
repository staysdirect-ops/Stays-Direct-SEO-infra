<!doctype html>
<html>
  <body
    style="
      font-family: Arial, sans-serif;
      color: #0f2440;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    "
  >
    <p style="font-size: 20px; font-weight: 800; margin: 0 0 16px">
      Stays<span style="color: #f26b1d">Direct</span> Growth Engine
    </p>
    <h2 style="font-size: 18px">Reset your password</h2>
    <p>Use this link to sign in, then set a new password on the Account page.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account"
        style="
          display: inline-block;
          background: #0f2440;
          color: #fff;
          padding: 10px 18px;
          border-radius: 6px;
          text-decoration: none;
        "
        >Reset your password</a
      >
    </p>
    <p style="font-size: 12px; color: #64748b">
      If you weren't expecting this email, you can ignore it.
    </p>
  </body>
</html>
